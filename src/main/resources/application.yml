spring:
  application:
    name: transactionservice


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transactions_db}
    username: ${DB_USER:username}
    password: ${DB_PASS:password}
    driver-class-name: ${DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
  main:
    allow-circular-references: true

  cloud:
    compatibility-verifier:
      enabled: false

  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/transactions_db
    user: username
    password: password
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true


fixer:
  api:
    key: ${FIXER_API_KEY:7529ed053da23185e2f90105d5eccb98}

